name: Build and Publish Signed Release

# Manual-only release pipeline. It builds one arm64-v8a signed APK,
# verifies its signature, keeps a workflow artifact as backup, and
# publishes the same APK + SHA-256 file to GitHub Releases.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, for example 1.2.0'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes. Leave empty to auto-generate.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kinescope-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Validate release inputs and signing secrets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version_name must look like 1.2.0 or 1.2.0-beta.1" >&2
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "$name repository secret is not set; see RELEASE.md" >&2
              exit 1
            fi
          done

      - name: Prepare Gradle and signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinescope-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/kinescope-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version_code=$((10000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$version_code"

      - name: Verify, rename and checksum APK
        id: package
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release.apk"
          [ -f "$src" ] || { echo "Expected APK not found at $src" >&2; exit 1; }

          apk="app/build/outputs/apk/release/kinescope-v${VERSION_NAME}-arm64-v8a.apk"
          mv "$src" "$apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          zipalign="$build_tools/zipalign"
          for tool in "$apksigner" "$aapt" "$zipalign"; do
            [ -x "$tool" ] || { echo "Required Android build tool not found: $tool" >&2; exit 1; }
          done

          "$apksigner" verify --verbose --print-certs "$apk"
          "$zipalign" -c -v 4 "$apk"

          badging="$($aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          grep -q "package: name='com.kinescope.app'" <<<"$badging" || { echo "Unexpected applicationId" >&2; exit 1; }
          grep -q "versionName='$VERSION_NAME'" <<<"$badging" || { echo "Unexpected versionName" >&2; exit 1; }

          abi_entries="$(unzip -Z1 "$apk" | grep '^lib/' || true)"
          grep -q '^lib/arm64-v8a/' <<<"$abi_entries" || { echo "arm64-v8a native libraries missing" >&2; exit 1; }
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<<"$abi_entries"; then
            echo "Unexpected non-arm64 ABI packaged in release" >&2
            exit 1
          fi

          sha="${apk}.sha256"
          sha256sum "$apk" > "$sha"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha_path=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: kinescope-v${{ inputs.version_name }}-release
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          SHA_PATH: ${{ steps.package.outputs.sha_path }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Use a new version_name." >&2
            exit 1
          fi

          args=(release create "$TAG" "$APK_PATH" "$SHA_PATH" --target "$GITHUB_SHA" --title "Kinescope $TAG")
          if [ -n "$RELEASE_NOTES" ]; then
            notes_file="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
            args+=(--notes-file "$notes_file")
          else
            args+=(--generate-notes)
          fi
          gh "${args[@]}"

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/kinescope-release.jks" "$RUNNER_TEMP/release-notes.md"
